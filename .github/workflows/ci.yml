name: CI

on:
  push:
    branches: [main, "rol/**"]
  pull_request:

jobs:
  pruebas:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -p no:warnings

  esquema:
    name: Esquema en PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taller
          POSTGRES_PASSWORD: ci-solo-pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cargar db/schema.sql
        env:
          PGPASSWORD: ci-solo-pruebas
        run: psql -h localhost -U postgres -d taller -v ON_ERROR_STOP=1 -f db/schema.sql

  documento:
    name: Documento de Ingeniería (LaTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/documento
          root_file: IS1-Fase1-EquipoB.tex
      - uses: actions/upload-artifact@v4
        with:
          name: documento-ingenieria
          path: docs/documento/IS1-Fase1-EquipoB.pdf
